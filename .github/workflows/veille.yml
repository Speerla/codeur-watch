name: Veille Codeur

on:
  # DÉCLENCHEUR PRINCIPAL : un appel HTTP extérieur.
  #
  # Mesuré le 31/08/2026 sur les vingt dernières exécutions : le planificateur
  # de GitHub réclamait 20 minutes et livrait entre 1 h et 8 h d'écart. C'est un
  # comportement connu et sans recours, GitHub déclasse les workflows planifiés.
  # Sur une veille où un projet ramasse jusqu'à 7 offres par heure, ce retard
  # coûte la mission.
  #
  # On garde donc GitHub pour le travail, et on confie l'horloge à un service de
  # cron externe qui, lui, tient la minute. Il suffit qu'il poste :
  #
  #   curl -X POST https://api.github.com/repos/Speerla/codeur-watch/dispatches \
  #        -H "Authorization: Bearer <TOKEN>" \
  #        -H "Accept: application/vnd.github+json" \
  #        -d '{"event_type":"veille"}'
  #
  # Le jeton doit être un PAT à portée restreinte : ce dépôt uniquement,
  # permission Contents en écriture, rien d'autre.
  repository_dispatch:
    types: [veille]

  schedule:
    # Filet de sécurité, rien de plus. Si le déclencheur externe tombe en panne,
    # la veille continue de tourner, en retard mais elle tourne.
    - cron: "*/5 5-21 * * *"
  workflow_dispatch:
    inputs:
      min_score:
        description: "Seuil de score"
        default: "8"
      max_age:
        description: "Fenêtre en heures"
        default: "3"

concurrency:
  group: veille-codeur
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # état des projets déjà signalés, pour ne jamais envoyer deux fois le même
      - name: Restaurer l'état
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: codeur-state-${{ github.run_id }}
          restore-keys: codeur-state-

      - name: Scanner le flux
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUDIT_FROM: ${{ secrets.AUDIT_FROM }}
          WATCH_TO: ${{ secrets.WATCH_TO }}
        run: |
          python watch.py --notify \
            --min-score "${{ github.event.inputs.min_score || '8' }}" \
            --min-budget 500 \
            --max-age "${{ github.event.inputs.max_age || '3' }}"

      - name: Sauver l'état
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: codeur-state-${{ github.run_id }}
